# =============================================================================
# Scrapyard — one container, one port, everything.
#
#   cp apps/api/.env.example .env      # compose reads .env from the repo root
#   docker compose up --build
#
#   → http://localhost:3000/login      the sign-in wall (public)
#   → http://localhost:3000/           the app (302s to /login without a session)
#
#   docker compose exec api node dist/database/seed.js         # demo racers
#
# The React bundle is baked into the image and served *behind the session
# check*, so an unauthenticated visitor never receives the JavaScript.
#
# ── Publishing it on a Cloudflare domain ─────────────────────────────────────
#
#   docker compose --profile tunnel up -d
#
# Adds a `cloudflared` sidecar that dials OUT to Cloudflare, so your domain
# serves the app over TLS with no port forwarding, no public IP and no inbound
# firewall rule. See DEPLOY-CLOUDFLARE.md. Requires TUNNEL_TOKEN in .env.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: scrapyard-api:latest
    container_name: scrapyard-api
    restart: unless-stopped

    # Bound to loopback only. The tunnel reaches the container over the compose
    # network, so nothing needs to be exposed on the host's public interface.
    # Change to '${PORT:-3000}:3000' only if you're fronting it yourself.
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'

    networks:
      - scrapyard

    environment:
      NODE_ENV: production
      PORT: 3000
      # The database lives on the named volume below, not in the image.
      DATABASE_DIR: /data

      # --- required: see apps/api/.env.example -----------------------------
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?set GOOGLE_CALLBACK_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      # Sign-in is locked to these Google Workspace domains. Never leave empty —
      # the API refuses to boot rather than allow open sign-in.
      ALLOWED_WORKSPACE_DOMAINS: ${ALLOWED_WORKSPACE_DOMAINS:-cytactic.com}
      # Single source of truth for who is an admin, reconciled on every login.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-amit@cytactic.com}

      # --- optional --------------------------------------------------------
      # Leave EMPTY when this container serves the app itself (the default) —
      # post-login redirects then stay relative and work behind any hostname or
      # proxy. Only set it if the bundle is hosted on a different origin.
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      SCRAPYARD_TIMEZONE: ${SCRAPYARD_TIMEZONE:-Asia/Jerusalem}
      # Set to 1 when a TLS terminator or load balancer fronts this container.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Set true if TLS is terminated upstream but NODE_ENV isn't production.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Login background: a YouTube id, or `none` to use the animated grid.
      # A file at public/login/background.mp4 overrides this.
      LOGIN_BACKGROUND_YOUTUBE_ID: ${LOGIN_BACKGROUND_YOUTUBE_ID:-xt_1gJkjdec}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

    volumes:
      - scrapyard-db:/data
      # Bind-mounted so you can drop a background.mp4 in and just restart —
      # no rebuild needed. Read-only; the app never writes here.
      - ./apps/api/public/login:/app/public/login:ro

    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    # The JSON store is single-writer by design (one in-process mutex).
    # Do not scale this service past one replica.
    deploy:
      replicas: 1

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — optional, enable with `--profile tunnel`.
  #
  # cloudflared opens an outbound connection to Cloudflare's edge and serves
  # your hostname from it. What that buys:
  #
  #   · a real TLS certificate, which Google OAuth requires
  #   · no port forwarding, no public IP, no inbound firewall rule
  #   · the origin's address is never exposed
  #   · DDoS protection and caching at the edge, free
  #
  # The tunnel's Public Hostname must point at `http://api:3000` — the service
  # name on this network, not localhost, because cloudflared is its own container.
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: scrapyard-tunnel
    restart: unless-stopped
    profiles: ['tunnel']

    # Token-based ("remote-managed") tunnel: routing lives in the Zero Trust
    # dashboard, so there's no config file to keep in sync with this repo.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}

    networks:
      - scrapyard

    depends_on:
      api:
        condition: service_healthy

    # It only ever makes outbound connections; it needs nothing else.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  scrapyard:
    driver: bridge

volumes:
  scrapyard-db:
    driver: local
