# ---------------------------------------------------------------------------
# Scrapyard on Render — https://render.com/docs/blueprint-spec
#
# One web service. Nest serves the API, the login page and the React bundle
# from a single origin, so there is nothing else to wire up. MongoDB Atlas
# lives outside Render (its free tier is more generous than anything here).
#
# To use: push this file, then Render Dashboard -> New -> Blueprint. You'll be
# prompted for every variable marked `sync: false`.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: scrapyard
    runtime: node
    # Free: 512 MB / 0.1 CPU, spins down after 15 minutes idle, ~1 minute to
    # wake. 750 instance-hours a month across the whole workspace.
    plan: free
    # Closest region to Tel Aviv. Cannot be changed after creation — put the
    # Atlas cluster in eu-central-1 (Frankfurt) too, or every query pays an
    # ocean crossing.
    region: frankfurt

    # devDependencies are needed here: tsc and vite build the app. Render only
    # sets NODE_ENV=production at *runtime*, so `npm ci` still installs them.
    buildCommand: npm ci && npm run build
    startCommand: npm start

    # Render polls this and holds the old instance up until it answers, which
    # is what makes a deploy zero-downtime.
    healthCheckPath: /api/health

    # Deploy on every push to the default branch.
    autoDeployTrigger: commit

    envVars:
      # --- Runtime ---------------------------------------------------------
      # Render's default. Our main.ts falls back to 3000, which would work but
      # only after Render probes for the open port; setting it is faster.
      - key: PORT
        value: 10000
      # TLS terminates at Render's edge, so the hop to this process is plain
      # HTTP. Without this, request.protocol and request.ip lie.
      - key: TRUST_PROXY
        value: "true"

      # --- Session ---------------------------------------------------------
      # Render generates a 256-bit value once and keeps it. Rotating it logs
      # everyone out; it is deliberately not something you have to invent.
      - key: JWT_SECRET
        generateValue: true

      # --- Database (you supply) -------------------------------------------
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: scrapyard

      # --- Google OAuth (you supply) ---------------------------------------
      # The callback must be byte-identical to the one in the Google console,
      # which means you need the service's URL first. Deploy once, copy the
      # onrender.com hostname, then fill these in and redeploy.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

      # --- Access ----------------------------------------------------------
      # The API refuses to boot with an empty domain list. There is no open
      # sign-in mode.
      - key: ALLOWED_WORKSPACE_DOMAINS
        value: cytactic.com
      - key: ADMIN_EMAILS
        value: amit@cytactic.com

      # --- Behaviour -------------------------------------------------------
      - key: SCRAPYARD_TIMEZONE
        value: Asia/Jerusalem
      - key: LOGIN_BACKGROUND_YOUTUBE_ID
        value: xt_1gJkjdec

      # WEB_ORIGIN is deliberately absent. One origin serves everything, so
      # CORS stays off; setting it would break post-login redirects.
